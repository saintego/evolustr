name: Publish to npm
# Manual: Actions → Publish to npm → Run workflow. Needs the NPM_TOKEN secret.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance -w @evolustr/core -w @evolustr/client -w @evolustr/signer -w @evolustr/react -w @evolustr/rn
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
